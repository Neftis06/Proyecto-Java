apiVersion: v1
kind: ConfigMap
metadata:
  name: api-retail-config
data:
  # Sobreescribimos la URL de H2 para que guarde un archivo físico dentro del Pod
  SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/retaildb;DB_CLOSE_DELAY=-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-retail-secret
type: Opaque
data:
  # Usuario: 'sa' en base64 -> c2E=
  SPRING_DATASOURCE_USERNAME: c2E=
  # Password: (vacio) en base64 -> ""
  SPRING_DATASOURCE_PASSWORD: ""