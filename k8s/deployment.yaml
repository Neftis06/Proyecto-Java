apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-retail-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-retail
  template:
    metadata:
      labels:
        app: api-retail
    spec:
      containers:
      - name: api-retail-container
        # Asegúrate de usar el mismo nombre de la imagen construida localmente
        image: retail-api-local:v1.0 
        imagePullPolicy: IfNotPresent # Importante en Docker Desktop
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: api-retail-config
        - secretRef:
            name: api-retail-secret
        volumeMounts:
        - name: datos-almacenados
          mountPath: "/app/data"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: datos-almacenados
        persistentVolumeClaim:
          claimName: api-retail-pvc